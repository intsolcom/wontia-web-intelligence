# Add these locations inside the server block for sonika.com.co.
# Public URL: https://sonika.com.co/directorio
# App: wontia-directory container on 127.0.0.1:4018

location = /directorio {
    proxy_pass http://127.0.0.1:4018;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /directorio;
    proxy_read_timeout 60s;
}

location ^~ /directorio/ {
    proxy_pass http://127.0.0.1:4018;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /directorio;
    proxy_read_timeout 60s;
}
